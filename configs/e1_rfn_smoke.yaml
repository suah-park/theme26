experiment:
  id: e1_rfn_smoke
  stage: rfn
  seed: 0

model:
  feature_channels: 8
  kernel_size: 3
  num_blocks: 1
  layers_per_block: 2
  growth_rate: 4

data:
  mode: synthetic
  train_samples: 8
  validation_samples: 4
  x_size: 16
  y_size: 16

training:
  epochs: 3
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0
  mixed_precision: false
  gradient_clip_norm: 1.0

output_dir: runs/e1_rfn_smoke
