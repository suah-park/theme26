experiment:
  id: e1_ami_berea_smoke
  stage: ami
  seed: 1

model:
  settings: configs/model/saint_x4.yaml
  profile: ami_cpu

data:
  mode: raw_ami_smoke
  path_env: THEME26_GRAYSCALE_RAW
  metadata:
    sample_id: berea
    source_core_id: berea
    shape_xyz: [1000, 1000, 1000]
    spacing_um_xyz: [2.25, 2.25, 2.25]
    dtype: uint8
    endianness: not-applicable
    storage_order: XYZ
  crop_origin_xyz: [372, 372, 372]
  crop_shape_xyz: [256, 256, 256]
  normalization_id: smoke_uint8_0_255
  normalization:
    lower: 0
    upper: 255
  max_marginals: 8

training:
  batch_size: 1
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  mixed_precision: false
  gradient_clip_norm: 1.0
  max_steps_per_epoch: 1
  max_validation_steps: 1

output_dir: runs/e1_ami_berea_smoke
