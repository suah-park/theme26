experiment:
  id: e2_rfn_gpu_pilot
  stage: rfn
  seed: 1
  objective: l1_plus_gradient_2d
model:
  settings: configs/model/saint_x4.yaml
  profile: rfn_target
data:
  mode: berea_rfn_cache
  cache_dir: runs/e2_ami_cache_seed1_ep10_20261007_01
  ami_checkpoint: runs/e2_ami_seed1_ep10_20261007_02/best.pt
  source:
    mode: berea_manifest
    path_env: THEME26_GRAYSCALE_RAW
    manifest: configs/data/berea_crops.yaml
    protocol_dir: configs/data
    minimum_buffer_voxels: 32
    metadata:
      sample_id: berea
      source_core_id: Berea
      shape_xyz:
      - 1000
      - 1000
      - 1000
      spacing_um_xyz:
      - 2.25
      - 2.25
      - 2.25
      dtype: uint8
      endianness: not-applicable
      storage_order: XYZ
training:
  loss_region: all
  checkpoint_metric: primary_mae
  batch_size: 8
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.0
  mixed_precision: false
  gradient_clip_norm: 1.0
  num_workers: 0
  pin_memory: true
  max_steps_per_epoch: 2
  max_validation_steps: 2
  progress_interval_steps: 1
  gradient_weight: 0.1
  performance_probe: true
output_dir: runs/e2_rfn_gpu_pilot_20261007_01
